[project]
name = "personal-podcast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luca Rubeni", email = "l.rubeni2000@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
personal-podcast = "src.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""
